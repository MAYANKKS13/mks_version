<div class="red">
  <div class="topic">Red</div>
    <div id="cards_landscape_wrap-2">
      <div class="container">
        <div class="row">
          <div class="col-md-4" *ngFor="let song of songs">
            <div class="song-card" [class.playing]="isCurrentSong(song)">
                <div class="image-container">
                    <img [src]="song.image" [alt]="song.name">
                    <div class="play-overlay" (click)="playSong(song)">
                        {{
                        isCurrentSong(song) &&
                        (musicService.isPlaying | async)
                        ? '⏸'
                        : '▶'
                        }}
                    </div>
                </div>
                <div class="song-info">
                    <div class="playing-badge" *ngIf="isCurrentSong(song)"> 🎵 NOW PLAYING </div>
                    <h5>{{song.name}}</h5>
                    <div class="song-actions">
                        <button class="favorite-btn" (click)="$event.stopPropagation(); favoriteService.toggleFavorite(song)">
                            {{
                                favoriteService.isFavorite(song)
                                ? '❤️'
                                : '🤍'
                            }}
                        </button>
                        <button class="play-btn" (click)="playSong(song)">
                            {{
                            isCurrentSong(song) &&
                            (musicService.isPlaying | async)
                            ? 'Pause'
                            : 'Play'
                            }}
                        </button>
                  </div>
                </div>
              </div>
           </div>
        </div>
      </div>
    </div>
</div>
